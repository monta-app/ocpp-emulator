<!--
  Menu-bar / system-tray glyph: the Monta symbol knocked out of a rounded tile.

  One file serves every platform because the glyph is carried entirely by the
  alpha channel. macOS is handed this as a template image (see
  apple.awt.enableTemplateImages in App.kt): it throws the colour away and
  re-tints the remaining silhouette for a light or dark menu bar, and the
  symbol survives because it is a hole rather than a lighter fill. Windows and
  Linux draw it as-is. So the blue below is simply ignored on macOS - keep the
  detail in the alpha, never in a second fill colour, or macOS gets a blob.

  The symbol is knocked out of a solid tile rather than standing alone: on its
  own its strokes are around a pixel wide at the ~20px a tray actually draws,
  and grey out to nothing. The brand guide says as much - 32px is the minimum
  for the symbol by itself.

  Light Blue rather than the signature Primary Blue, which only matters off
  macOS: #302EE0 is dark enough that the knockout stops reading against a dark
  taskbar. Same reason the dark theme leads with Light Blue in MontaColors.

  Geometry is the symbol's own 111x111 coordinate space, padded to 167, so the
  path below is the untouched artwork from design/monta-symbol.svg. The
  fill-rule="evenodd" is what turns it into a hole: inside the tile every
  crossing count shifts by one, so the symbol's strokes drop out and its
  counters fill back in.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="167" height="167" viewBox="-28 -28 167 167" fill="#337DFF">
  <path
    fill-rule="evenodd"
    d="M2,-28 H109 A30,30 0 0 1 139,2 V109 A30,30 0 0 1 109,139 H2 A30,30 0 0 1 -28,109 V2 A30,30 0 0 1 2,-28 Z
       M107.6,111c-.5,0-1-.1-1.5-.4l-50.6-25.1L4.9,110.6c-1,.5-2.3.5-3.3-.2C.6,109.8,0,108.8,0,107.6V3.4C0,2.2.6,1.1,1.6.5,2.6-.1,3.8-.2,4.9.4l50.6,25.4L106.1.4c1-.5,2.3-.5,3.3.1,1,.6,1.6,1.7,1.6,2.9v104.2c0,1.2-.6,2.3-1.6,2.9-.5.3-1.2.5-1.8.5ZM63.1,81.8l41.1,20.4v-40.8l-41.1,20.4ZM6.8,61.4v40.8l41.1-20.4L6.8,61.4ZM10.8,55.8l44.7,22.2,44.7-22.2-44.7-22.5L10.8,55.8ZM63,29.6l41.2,20.7V8.9l-41.2,20.7ZM6.8,8.9v41.5l41.2-20.7L6.8,8.9Z"
  />
</svg>
